<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema de Asistencia</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #000; --card: #111; --accent: #e8ff47; --text: #fff; --red: #ff4d4d; --green: #4ade80; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; }
        .card { background: var(--card); border: 1px solid #333; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 15px; }
        input { width: 100%; padding: 18px; margin: 15px 0; border-radius: 12px; border: 1px solid #444; background: #222; color: #fff; font-size: 22px; text-align: center; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn-main { background: var(--accent); color: #000; }
        .btn-red { background: none; border: 1px solid var(--red); color: var(--red); margin-top: 20px; }
        #qr-container { background: #fff; padding: 15px; display: inline-block; border-radius: 12px; margin: 15px 0; }
        #qr-container img { width: 220px; height: 220px; }
        .stats { display: flex; gap: 10px; margin-bottom: 15px; }
        .stat-box { flex: 1; background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #333; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; padding: 15px 0 30px 0; border-top: 1px solid #333; }
        .nav button { flex: 1; background: none; border: none; color: #888; font-size: 12px; font-weight: bold; }
        .nav button.active { color: var(--accent); }
        .list-item { text-align: left; padding: 10px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        .badge { font-size: 10px; padding: 3px 8px; border-radius: 4px; background: #333; }
    </style>
</head>
<body>

    <div id="view-alumno" style="display:none">
        <div class="card">
            <div style="font-size: 50px; margin-bottom: 10px;">📱</div>
            <h2>Registrar Presente</h2>
            <p style="color: #888;">Ingresa tu código ID de alumno</p>
            <input type="text" id="alu-id" placeholder="ALU-001" autocomplete="off">
            <button class="btn btn-main" onclick="registrar()">ENVIAR ASISTENCIA</button>
        </div>
    </div>

    <div id="view-profe" style="display:none">
        <div class="stats">
            <div class="stat-box"><b id="count-p" style="color:var(--green); font-size:24px">0</b><br><small>PRESENTES</small></div>
            <div class="stat-box"><b id="count-t" style="font-size:24px">0</b><br><small>TOTAL</small></div>
        </div>
        
        <div id="panel-qr" class="card">
            <p style="font-weight: bold; margin-bottom: 10px;">Código QR para la clase</p>
            <div id="qr-container"></div>
            <p style="font-size: 12px; color: #888;">Los alumnos escanean este código<br>para abrir su página de registro.</p>
            <button class="btn btn-red" onclick="cerrar()">Finalizar Clase y Marcar Ausentes</button>
        </div>

        <div id="panel-lista" class="card" style="display:none;">
            <h3 style="text-align: left; margin-bottom: 15px;">Control en Vivo:</h3>
            <div id="lista-alumnos">Cargando lista...</div>
        </div>

        <div class="nav">
            <button onclick="tab('qr')" id="btn-qr" class="active">MOSTRAR QR</button>
            <button onclick="tab('lista')" id="btn-lista">VER LISTADO</button>
        </div>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyu_pfpQjG0kjfPN-GyCbsiTX3dE1tq89p-YCojsWFWTafYNhMLJtuuQQhYPfPWRhEe/exec';
    
    // Verificamos si es el profesor usando la "llave" en la URL
    const params = new URLSearchParams(window.location.search);
    const isAdmin = params.get('admin') === '123';
    
    let db = [];
    let asistenciaLocal = {};

    async function init() {
        if (isAdmin) {
            document.getElementById('view-profe').style.display = 'block';
            // El QR apunta a la URL limpia (sin la llave de admin)
            const urlLimpia = window.location.href.split('?')[0];
            new QRCode(document.getElementById("qr-container"), {
                text: urlLimpia,
                width: 220, height: 220
            });
        } else {
            document.getElementById('view-alumno').style.display = 'block';
        }
        
        await cargarDatos();
    }

    async function cargarDatos() {
        try {
            const r = await fetch(SCRIPT_URL);
            db = await r.json();
            document.getElementById('count-t').innerText = db.length;
            db.forEach(a => asistenciaLocal[a.code] = 'pendiente');
            renderLista();
        } catch(e) { console.error("Error cargando base de datos"); }
    }

    async function registrar() {
        const id = document.getElementById('alu-id').value.trim().toUpperCase();
        const alumno = db.find(a => a.code === id);
        
        if(!alumno) return alert("Código ID no válido.");

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    fecha: new Date().toLocaleDateString(),
                    codigo: id, nombre: alumno.nombre, pc: alumno.pc,
                    estado: 'Presente', hora: new Date().toLocaleTimeString()
                })
            });
            alert("¡Presente registrado exitosamente!");
            // Redirigir a una página de agradecimiento o limpiar para evitar re-envíos
            document.body.innerHTML = "<div style='text-align:center; padding:50px;'><h1>✅ Hecho</h1><p>Tu asistencia ha sido enviada.</p></div>";
        } catch(e) { alert("Error al enviar. Revisa tu conexión."); }
    }

    function tab(t) {
        document.getElementById('panel-qr').style.display = t === 'qr' ? 'block' : 'none';
        document.getElementById('panel-lista').style.display = t === 'lista' ? 'block' : 'none';
        document.getElementById('btn-qr').classList.toggle('active', t === 'qr');
        document.getElementById('btn-lista').classList.toggle('active', t === 'lista');
    }

    function renderLista() {
        if(!isAdmin) return;
        const container = document.getElementById('lista-alumnos');
        container.innerHTML = db.map(a => `
            <div class="list-item">
                <span><b>${a.nombre}</b> <br><small>${a.pc}</small></span>
                <span class="badge">${asistenciaLocal[a.code].toUpperCase()}</span>
            </div>
        `).join('');
    }

    init();
</script>
</body>
</html>
