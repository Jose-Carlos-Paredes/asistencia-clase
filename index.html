<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistencia: Escáner Profe</title>
    <script src="https://unpkg.com/html5-qr-scanner@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #e8ff47; --green: #4ade80; --red: #ff4d4d; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; }
        .card { background: var(--card); border: 1px solid #282828; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 15px; }
        .stats { display: flex; gap: 10px; margin-bottom: 15px; }
        .stat-box { flex: 1; background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #282828; text-align: center;}
        
        /* Contenedor de la cámara optimizado */
        #camera-container { width: 100%; max-width: 400px; height: 300px; margin: 0 auto; border-radius: 12px; overflow: hidden; background: #222; border: 2px solid #333; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #222; text-align: left; }
        .badge { font-size: 11px; padding: 5px 10px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="stats">
        <div class="stat-box"><b id="count-p" style="color:var(--green); font-size:24px">0</b><br><small>PRESENTES</small></div>
        <div class="stat-box"><b id="count-t" style="font-size:24px">0</b><br><small>TOTAL</small></div>
    </div>

    <div class="card" style="padding: 15px;">
        <h3 style="margin-top: 0; margin-bottom: 5px;">Escáner de Asistencia</h3>
        <p id="camera-status" style="color: #888; font-size: 12px; margin-bottom: 15px;">Iniciando cámara...</p>
        <div id="camera-container"></div>
    </div>

    <div class="card" id="status-card" style="display: none; border-color: var(--green);">
        <h4 id="status-msg" style="margin: 0;"></h4>
    </div>

    <div class="card" style="padding: 10px;">
        <h3 style="text-align: left; margin: 10px 15px;">Listado de Clase</h3>
        <div id="lista-output">Cargando alumnos...</div>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxWN1F9ATZlu52xKIIaFv_DYnyFehHQILsyG8VY35VKva3ZDC_dXTOoeF8ExXLqjG2f/exec';
    let db = [];
    let yaRegistradosHoy = new Set();
    let isScanning = true;
    let html5QrCode;

    function getFecha() {
        const d = new Date();
        return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
    }

    async function cargarBD() {
        try {
            const resp = await fetch(SCRIPT_URL + '?t=' + Date.now());
            db = await resp.json();
            document.getElementById('count-t').innerText = db.length;
            renderLista();
        } catch(e) {
            document.getElementById('lista-output').innerText = "Error cargando base de datos.";
        }
    }

    function renderLista() {
        document.getElementById('lista-output').innerHTML = db.map(a => `
            <div class="list-item">
                <span><b>${a.nombre}</b><br><small style="color:#777">ID: ${a.code} | PC: ${a.pc}</small></span>
                <span class="badge" id="badge-${a.code}" style="background:#333; color:#fff">PENDIENTE</span>
            </div>
        `).join('');
    }

    async function registrarEscaneo(decodedText) {
        if (!isScanning) return;
        const idAlumno = decodedText.trim().toUpperCase();
        
        const alumno = db.find(x => x.code === idAlumno);
        if (!alumno) {
            showStatus("⚠️ ID no reconocido: " + idAlumno, "var(--red)");
            return;
        }

        if (yaRegistradosHoy.has(idAlumno)) {
            showStatus("⚠️ " + alumno.nombre + " ya está presente.", "var(--red)");
            return;
        }

        isScanning = false;
        showStatus("Procesando a " + alumno.nombre + "...", "var(--accent)");

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    fecha: getFecha(),
                    codigo: alumno.code,
                    nombre: alumno.nombre,
                    pc: alumno.pc,
                    hora: new Date().toLocaleTimeString('es-AR')
                })
            });

            const res = await response.json();

            if (res.status === "error") {
                yaRegistradosHoy.add(idAlumno);
                marcarPresente(idAlumno);
                showStatus("⚠️ " + alumno.nombre + " ya estaba registrado.", "var(--red)");
            } else {
                yaRegistradosHoy.add(idAlumno);
                marcarPresente(idAlumno);
                showStatus("✅ ¡" + alumno.nombre + " Presente!", "var(--green)");
                playTone();
            }
        } catch(e) {
            showStatus("Error de conexión. Reintenta.", "var(--red)");
        }
        
        setTimeout(() => { isScanning = true; }, 2000);
    }

    function showStatus(msg, color) {
        const card = document.getElementById('status-card');
        const text = document.getElementById('status-msg');
        card.style.display = 'block';
        card.style.borderColor = color;
        text.innerText = msg;
        text.style.color = color;
    }

    function marcarPresente(id) {
        const badge = document.getElementById(`badge-${id}`);
        if(badge) {
            badge.style.background = "var(--green)";
            badge.style.color = "#000";
            badge.innerText = "PRESENTE";
        }
        document.getElementById('count-p').innerText = yaRegistradosHoy.size;
    }

    function playTone() {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 1000; gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start(); osc.stop(ctx.currentTime + 0.12);
    }

    // --- NUEVO INICIO DE CÁMARA FORZADO ---
    async function iniciarCamara() {
        html5QrCode = new Html5Qrcode("camera-container");
        const statusText = document.getElementById("camera-status");

        try {
            // "environment" obliga al navegador a usar la cámara trasera directamente
            await html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 15, qrbox: { width: 220, height: 220 } },
                registrarEscaneo,
                () => {} // Ignorar fallos de frames continuos
            );
            statusText.innerText = "Apunta la cámara al código QR del alumno";
        } catch (err) {
            console.error(err);
            statusText.innerText = "❌ Permiso de cámara denegado o no disponible.";
            statusText.style.color = "var(--red)";
        }
    }

    async function init() {
        await cargarBD();
        await iniciarCamara();
    }

    init();
</script>
</body>
</html>
