<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistencia: Escáner Profe</title>
    <script src="https://unpkg.com/html5-qr-scanner@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #e8ff47; --green: #4ade80; --red: #ff4d4d; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; margin: 0; padding: 15px; }
        .card { background: var(--card); border: 1px solid #282828; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 15px; }
        .stats { display: flex; gap: 10px; margin-bottom: 15px; }
        .stat-box { flex: 1; background: var(--card); padding: 15px; border-radius: 12px; border: 1px solid #282828; text-align: center;}
        
        /* Estilos para el escáner */
        #qr-reader { border: 2px solid #333 !important; border-radius: 16px; overflow: hidden; background: #000; }
        #qr-reader__scan_region { background: #000; }
        #qr-reader__dashboard { border-top: 1px solid #333; padding: 15px !important; }
        #qr-reader__dashboard_btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #qr-reader button { background: #333; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 8px; cursor: pointer; margin: 5px; }
        #qr-reader__camera_selection { background: #222; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 8px; }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #222; text-align: left; }
        .pc-badge { background: #333; padding: 4px 8px; border-radius: 5px; font-size: 10px; margin-right: 10px; min-width: 35px; text-align: center; }
        .badge { font-size: 10px; padding: 4px 8px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="stats">
        <div class="stat-box"><b id="count-p" style="color:var(--green); font-size:24px">0</b><br><small>PRESENTES</small></div>
        <div class="stat-box"><b id="count-t" style="font-size:24px">0</b><br><small>TOTAL</small></div>
    </div>

    <div class="card" style="padding: 10px;">
        <h3 style="margin-bottom: 10px;">Escáner de Asistencia</h3>
        <p style="color: #888; font-size: 12px; margin-bottom: 15px;">Apunta la cámara al código QR del alumno</p>
        <div id="qr-reader"></div>
    </div>

    <div class="card" id="status-card" style="display: none; border-color: var(--green);">
        <h4 id="status-msg" style="margin: 0; color: var(--green);">Último: Juan Pérez (PC 15)</h4>
    </div>

    <div class="card" style="padding: 10px;">
        <h3 style="text-align: left; margin: 10px;">Listado de Clase</h3>
        <div id="lista-output">Cargando base de datos...</div>
    </div>

<script>
    const SCRIPT_URL = 'TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI'; // <--- PEGA TU URL AQUÍ
    let db = [];
    let yaRegistradosHoy = new Set(); // Para llevar la cuenta localmente
    let isScanning = true;

    // Formato de fecha para enviar y comparar: d/M/yyyy
    function getFecha() {
        const d = new Date();
        return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
    }

    // Cargar la base de datos de alumnos
    async function cargarBD() {
        try {
            const resp = await fetch(SCRIPT_URL);
            db = await resp.json();
            document.getElementById('count-t').innerText = db.length;
            renderLista();
        } catch(e) {
            document.getElementById('lista-output').innerText = "Error cargando alumnos. Revisa el Apps Script.";
        }
    }

    // Dibujar la lista de alumnos
    function renderLista() {
        const listaOut = document.getElementById('lista-output');
        listaOut.innerHTML = db.map(a => `
            <div class="list-item">
                <span><b>${a.nombre}</b><br><small style="color:#777">ID: ${a.code}</small></span>
                <span class="badge" id="badge-${a.code}" style="background:#333; color:#fff">PENDIENTE</span>
            </div>
        `).join('');
    }

    // --- FUNCIÓN PRINCIPAL: REGISTRAR EL ESCANEO ---
    async function registrarEscaneo(decodedText, decodedResult) {
        if (!isScanning) return; // Evitar escaneos múltiples por segundo
        const idAlumno = decodedText.trim().toUpperCase();
        
        // 1. Buscamos el alumno en la base de datos local
        const alumno = db.find(x => x.code === idAlumno);
        if (!alumno) {
            showStatus("⚠️ ID no reconocido: " + idAlumno, "var(--red)");
            return;
        }

        // 2. Revisamos si ya lo escaneamos en esta sesión
        if (yaRegistradosHoy.has(idAlumno)) {
            showStatus("⚠️ " + alumno.nombre + " ya está presente.", "var(--red)");
            return;
        }

        // Bloqueamos escáner momentáneamente
        isScanning = false;
        showStatus("Procesando: " + alumno.nombre + "...", "var(--accent)");

        // 3. Enviamos a Google Sheets
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    fecha: getFecha(),
                    codigo: alumno.code,
                    nombre: alumno.nombre,
                    pc: alumno.pc,
                    hora: new Date().toLocaleTimeString('es-AR')
                })
            });

            const res = await response.json();

            if (res.status === "error") {
                // Google Sheets dice que ya estaba
                yaRegistradosHoy.add(idAlumno);
                marcarComoPresenteEnLista(idAlumno);
                showStatus("⚠️ " + alumno.nombre + " ya estaba registrado.", "var(--red)");
            } else {
                // Éxito total
                yaRegistradosHoy.add(idAlumno);
                marcarComoPresenteEnLista(idAlumno);
                showStatus("✅ ¡" + alumno.nombre + " Presente!", "var(--green)");
                // Feedback sonoro opcional si lo deseas
                playSuccessSound(); 
            }
        } catch(e) {
            showStatus("Error de red. Intenta de nuevo.", "var(--red)");
        }
        
        // Desbloqueamos escáner en 1.5 segundos
        setTimeout(() => { isScanning = true; }, 1500);
    }

    // --- FUNCIONES AUXILIARES DE LA INTERFAZ ---
    function showStatus(msg, color) {
        const card = document.getElementById('status-card');
        const text = document.getElementById('status-msg');
        card.style.display = 'block';
        card.style.borderColor = color;
        text.innerText = msg;
        text.style.color = color;
    }

    function marcarComoPresenteEnLista(id) {
        // Actualizamos el badge en la lista
        const badge = document.getElementById(`badge-${id}`);
        if(badge) {
            badge.style.background = "var(--green)";
            badge.style.color = "#000";
            badge.innerText = "PRESENTE";
        }
        // Actualizamos el contador
        document.getElementById('count-p').innerText = yaRegistradosHoy.size;
    }

    function playSuccessSound() {
        // Un pitido simple para feedback rápido
        const a = new AudioContext();
        const o = a.createOscillator();
        const g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.frequency.value = 800; // Frecuencia del pitido
        g.gain.setValueAtTime(0.1, a.currentTime);
        o.start();
        o.stop(a.currentTime + 0.1); // Duración (0.1 seg)
    }

    // --- INICIALIZAR EL ESCÁNER ---
    function onScanError(errorMessage) { /* Ignorar errores de escaneo continuo */ }

    async function init() {
        // 1. Cargamos la base de datos
        await cargarBD();
        
        // 2. Iniciamos el escáner
        // fps: fotogramas por segundo. qrbox: tamaño del cuadrado de escaneo
        const html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { 
            fps: 10, 
            qrbox: {width: 250, height: 250},
            rememberLastUsedCamera: true
        });
        html5QrcodeScanner.render(registrarEscaneo, onScanError);
    }

    init();
</script>
</body>
</html>
