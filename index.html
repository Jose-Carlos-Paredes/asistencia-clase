<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Asistencia Profe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #000; --card: #121212; --accent: #e8ff47; --red: #ff4d4d; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 15px; padding-bottom: 100px; }
        .card { background: var(--card); border: 1px solid #282828; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 15px; }
        .btn { width: 100%; padding: 18px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-main { background: var(--accent); color: #000; }
        .btn-red { background: rgba(255,77,77,0.1); color: var(--red); border: 1px solid var(--red); }
        input { width: 100%; padding: 18px; border-radius: 12px; border: 1px solid #333; background: #1a1a1a; color: #fff; font-size: 22px; text-align: center; margin: 15px 0; box-sizing: border-box; }
        .nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #121212; display: flex; padding: 20px 0; border-top: 1px solid #282828; }
        .nav button { flex: 1; background: none; border: none; color: #666; font-weight: bold; }
        .nav button.active { color: var(--accent); }
        .list-item { padding: 15px; border-bottom: 1px solid #222; text-align: left; display: flex; align-items: center; }
        .pc-badge { background: #333; padding: 4px 8px; border-radius: 6px; font-size: 11px; margin-right: 15px; min-width: 45px; text-align: center; }
    </style>
</head>
<body>

    <div id="view-alumno" style="display:none">
        <div class="card">
            <h2>Asistencia</h2>
            <input type="text" id="alu-id" placeholder="INGRESAR ID">
            <button class="btn btn-main" id="btn-env" onclick="registrar()">ENVIAR PRESENTE</button>
        </div>
    </div>

    <div id="view-profe" style="display:none">
        <div class="card">
            <h3 id="txt-total">Cargando alumnos...</h3>
        </div>
        <div id="panel-qr" class="card">
            <div id="qr-container" style="background:#fff; padding:10px; display:inline-block; border-radius:10px"></div>
            <button class="btn btn-red" id="btn-fin" onclick="finalizar()">FINALIZAR CLASE (AUSENTES)</button>
        </div>
        <div id="panel-lista" class="card" style="display:none; padding:0">
            <div id="lista-output"></div>
        </div>
        <div class="nav">
            <button onclick="tab('qr')" id="b-qr" class="active">QR</button>
            <button onclick="tab('lista')" id="b-lista">LISTA</button>
        </div>
    </div>

<script>
    // URL DE TU SCRIPT DE GOOGLE
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbybDAFPQac467Mk2e3KNC8nhlSriOgw4uamlPWLvOQSYArk4dlbXFBjYtWbCGD1QZxW/exec';
    const isAdmin = window.location.search.includes('admin=123');
    let db = [];

    async function cargar() {
        try {
            // Añadimos un pequeño truco para evitar datos viejos del navegador
            const r = await fetch(SCRIPT_URL + '?t=' + Date.now());
            if (!r.ok) throw new Error();
            db = await r.json();
            
            if(isAdmin) {
                document.getElementById('txt-total').innerText = "Alumnos en Lista: " + db.length;
                document.getElementById('lista-output').innerHTML = db.map(a => `
                    <div class="list-item">
                        <span class="pc-badge">PC ${a.pc}</span>
                        <span><b>${a.nombre}</b></span>
                    </div>
                `).join('');
            }
        } catch(e) {
            if(isAdmin) document.getElementById('txt-total').innerText = "Reintentando conexión...";
            setTimeout(cargar, 3000); // Reintenta cada 3 segundos si falla
        }
    }

    async function registrar() {
        const id = document.getElementById('alu-id').value.trim().toUpperCase();
        const alu = db.find(x => x.code === id);
        if(!alu) return alert("ID no encontrado.");
        
        const btn = document.getElementById('btn-env');
        btn.disabled = true; btn.innerText = "ENVIANDO...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                fecha: new Date().toLocaleDateString('es-AR'),
                codigo: id, nombre: alu.nombre, pc: alu.pc,
                estado: 'Presente', hora: new Date().toLocaleTimeString('es-AR')
            })
        }).then(() => {
            alert("✅ Presente enviado correctamente.");
            location.reload();
        });
    }

    async function finalizar() {
        if(!confirm("¿Marcar ausentes en el Excel?")) return;
        const btn = document.getElementById('btn-fin');
        btn.disabled = true; btn.innerText = "PROCESANDO...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ action: "finalizar", fecha: new Date().toLocaleDateString('es-AR') })
        }).then(() => {
            alert("✅ Proceso completado.");
            btn.disabled = false; btn.innerText = "FINALIZAR CLASE (AUSENTES)";
        });
    }

    function tab(t) {
        document.getElementById('panel-qr').style.display = t==='qr'?'block':'none';
        document.getElementById('panel-lista').style.display = t==='lista'?'block':'none';
        document.getElementById('b-qr').className = t==='qr'?'active':'';
        document.getElementById('b-lista').className = t==='lista'?'active':'';
    }

    if(isAdmin) {
        document.getElementById('view-profe').style.display = 'block';
        new QRCode(document.getElementById("qr-container"), { 
            text: window.location.href.split('?')[0], 
            width: 200, 
            height: 200 
        });
    } else {
        document.getElementById('view-alumno').style.display = 'block';
    }
    cargar();
</script>
</body>
</html>
